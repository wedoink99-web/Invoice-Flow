<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceFlow</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%232f78e0%22/%3E%3Cstop offset=%221%22 stop-color=%22%23174d9c%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M156 100h140l66 66v236a16 16 0 0 1-16 16H156a16 16 0 0 1-16-16V116a16 16 0 0 1 16-16z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M296 100v50a16 16 0 0 0 16 16h50z%22 fill=%22%23c4d8f7%22/%3E%3Crect x=%22176%22 y=%22204%22 width=%22104%22 height=%2218%22 rx=%229%22 fill=%22%231d5fbf%22/%3E%3Crect x=%22176%22 y=%22246%22 width=%22160%22 height=%2212%22 rx=%226%22 fill=%22%239db9e6%22/%3E%3Crect x=%22176%22 y=%22278%22 width=%22160%22 height=%2212%22 rx=%226%22 fill=%22%239db9e6%22/%3E%3Crect x=%22176%22 y=%22310%22 width=%22110%22 height=%2212%22 rx=%226%22 fill=%22%239db9e6%22/%3E%3Crect x=%22176%22 y=%22354%22 width=%22160%22 height=%2224%22 rx=%229%22 fill=%22%231d5fbf%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#1d5fbf">
<style>
/* Layout: dark frame (top bar + left menu) around a light work area, like a desktop invoicing program */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface2:#f6f7f4; --ink:#1c2430; --muted:#667180; --line:#dde0da;
  --accent:#1d5fbf; --accent-ink:#ffffff; --accent-soft:#e3edfb;
  --side:#18222e; --side-ink:#c9d2dd; --side-active:#27384d; --side-line:#2a3846;
  --good:#1d7f4e; --good-soft:#e1f3e9; --warn:#9a5b08; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --surface:#1a212a; --surface2:#202833; --ink:#e6eaf0; --muted:#93a0b0; --line:#2c3743;
    --accent:#5b9bf0; --accent-ink:#0b1420; --accent-soft:#1b2e49;
    --side:#0d1319; --side-ink:#b9c4d1; --side-active:#1d2a3a; --side-line:#222d3a;
    --good:#4cc98a; --good-soft:#143324; --warn:#e5a94b; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3b1b19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a212a; --surface2:#202833; --ink:#e6eaf0; --muted:#93a0b0; --line:#2c3743;
  --accent:#5b9bf0; --accent-ink:#0b1420; --accent-soft:#1b2e49;
  --side:#0d1319; --side-ink:#b9c4d1; --side-active:#1d2a3a; --side-line:#222d3a;
  --good:#4cc98a; --good-soft:#143324; --warn:#e5a94b; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3b1b19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.2}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:16px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;background:var(--side);color:#fff;display:flex;align-items:center;gap:10px;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--side-line)}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em;margin-right:auto;display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.brand i{width:30px;height:30px;display:grid;place-items:center}
.brand svg{width:30px;height:30px}
.side{background:var(--side);padding:10px 8px;border-right:1px solid var(--side-line)}
.side nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:10px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;color:var(--side-ink);text-decoration:none;font-weight:500}
.side a:hover{background:var(--side-active);color:#fff}
.side a.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.main{padding:22px max(20px,env(safe-area-inset-right,0px)) 60px 26px;min-width:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:5px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.top-btn{background:transparent;border-color:var(--side-line);color:#fff}
.btn.top-btn:hover{background:var(--side-active)}
.btn.top-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px}
.pad{padding:18px}
.card>h2,.card .ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat small{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600}
.stat b{display:block;font-size:24px;margin-top:4px;letter-spacing:-.01em}
.stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px;max-width:340px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-href]{cursor:pointer}
.tbl tbody tr[data-href]:hover td{background:var(--surface2)}
.tbl tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line)}
.num{text-align:right;white-space:nowrap}
.tbl th.num{text-align:right}
.acts{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 9px;min-width:0}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:62px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{min-width:0}
.row{display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px;margin:0}
.meta{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.lines{width:100%;border-collapse:collapse;min-width:760px}
.lines th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.lines td{padding:5px 6px;vertical-align:top;border-bottom:1px solid var(--line)}
.lines .amt{padding-top:12px;text-align:right;white-space:nowrap;font-weight:600}
.lines td.tx{text-align:center;padding-top:12px}
.lines input.r{text-align:right}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;margin-top:16px}
.tot{width:100%;border-collapse:collapse}
.tot td{padding:5px 0}
.tot td:last-child{text-align:right;white-space:nowrap}
.tot input{width:90px;text-align:right;padding:4px 7px}
.tot tr.grand td{font-size:17px;font-weight:700;border-top:2px solid var(--ink);padding-top:9px}
.tot tr.due td{font-weight:700;color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:9px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding:14px 16px 0}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b{width:42%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.r{background:var(--good)}
.bars small{color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;padding:8px 16px 14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--accent)}
.legend i.r{background:var(--good)}
.steps{margin:0;padding-left:20px;line-height:1.9}

dialog.modal{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));box-shadow:var(--shadow)}
dialog.modal.wide{width:min(640px,calc(100vw - 24px))}
dialog.modal::backdrop{background:rgba(10,15,20,.55)}
.mform header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mform .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:18px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.mbody p{margin:0}
.mform footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 8px 8px}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50}
.toast{background:var(--side);color:#fff;padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);border-left:4px solid var(--good)}
.toast.bad{border-left-color:var(--bad)}

/* The paper is always white, like a printed page, in both themes */
.paper{position:relative;background:#ffffff;color:#1b2127;max-width:820px;margin:0 auto;padding:46px 50px;box-shadow:var(--shadow);font-size:13px;line-height:1.45;border:1px solid #d6d9d3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper img.logo{max-height:70px;max-width:200px;display:block;margin-bottom:10px;object-fit:contain}
.p-head{display:flex;justify-content:space-between;gap:24px;margin-bottom:26px}
.p-co{min-width:0}
.p-coname{font-size:19px;font-weight:700;margin-bottom:3px}
.p-addr{color:#46505b}
.p-doc{text-align:right}
.p-title{font-size:26px;font-weight:800;letter-spacing:.04em;color:#1d4f9f;margin-bottom:8px}
.p-meta{margin-left:auto;border-collapse:collapse}
.p-meta td{padding:2px 0 2px 16px}
.p-meta td:first-child{color:#667180;text-align:right}
.p-meta td:last-child{font-weight:600;text-align:right}
.p-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.p-parties h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#667180;margin-bottom:4px}
.p-lines{width:100%;border-collapse:collapse;margin-bottom:12px}
.p-lines th{background:#1d3557;color:#fff;text-align:left;padding:7px 9px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.p-lines td{padding:8px 9px;border-bottom:1px solid #e3e6e0;vertical-align:top}
.p-lines .r{text-align:right;white-space:nowrap}
.p-foot{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
.p-tot{width:100%;border-collapse:collapse}
.p-tot td{padding:4px 0}
.p-tot td:last-child{text-align:right;white-space:nowrap}
.p-tot tr.g td{font-size:16px;font-weight:800;border-top:2px solid #1b2127;padding-top:7px}
.p-tot tr.d td{font-weight:800;color:#1d4f9f;font-size:15px}
.p-box{margin-top:18px}
.p-box h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#667180;margin-bottom:3px}
.p-stamp{position:absolute;right:64px;top:196px;border:4px solid #1d7f4e;color:#1d7f4e;font-weight:800;font-size:34px;letter-spacing:.12em;padding:2px 16px;border-radius:6px;transform:rotate(-12deg);opacity:.75}
.p-small{font-size:12px;color:#46505b}
.p-pay{margin-top:14px;font-size:12px}
.p-pay td{padding:2px 14px 2px 0;color:#46505b}

@media (max-width:900px){
  .top{flex-wrap:wrap;gap:8px}
  .top .brand{flex:1 0 100%}
  .btn.top-btn{padding:5px 10px;font-size:13px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--side-line);padding:6px}
  .side nav{flex-direction:row;overflow-x:auto;position:static}
  .side a{padding:7px 11px;white-space:nowrap}
  .side a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
  .two,.bottom{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paper{padding:26px 18px}
  .p-head,.p-foot,.p-parties{grid-template-columns:minmax(0,1fr);display:grid}
  .p-doc{text-align:left}.p-meta{margin-left:0}
  .p-stamp{top:auto;bottom:40px}
}
.syncchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#d5dbe6;text-decoration:none;padding:4px 8px;border-radius:14px}
.syncchip i{width:9px;height:9px;border-radius:50%;background:#7a8499;display:inline-block}
.syncchip.ok i{background:#3fb97a}.syncchip.saving i{background:#e0a030}.syncchip.bad i{background:#e5564f}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:grid;gap:8px;margin-bottom:12px}
.check input[type=radio],.check input[type=checkbox]{width:auto;flex:none;margin:0}
.batch .paper{page-break-after:always;break-after:page;margin-bottom:18px}
.batch .paper:last-child{page-break-after:auto;break-after:auto}
.badge.stock-low{background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}

@media print{
  .top,.side,.noprint,.banner,#toasts{display:none!important}
  .app{display:block}
  html,body{background:#fff}
  .main{padding:0}
  .paper{box-shadow:none;border:0;max-width:none;padding:0;margin:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#dashboard"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f78e0"/><stop offset="1" stop-color="#174d9c"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><path d="M156 100h140l66 66v236a16 16 0 0 1-16 16H156a16 16 0 0 1-16-16V116a16 16 0 0 1 16-16z" fill="#fff"/>
<path d="M296 100v50a16 16 0 0 0 16 16h50z" fill="#c4d8f7"/>
<rect x="176" y="204" width="104" height="18" rx="9" fill="#1d5fbf"/>
<rect x="176" y="246" width="160" height="12" rx="6" fill="#9db9e6"/>
<rect x="176" y="278" width="160" height="12" rx="6" fill="#9db9e6"/>
<rect x="176" y="310" width="110" height="12" rx="6" fill="#9db9e6"/>
<rect x="176" y="354" width="160" height="24" rx="9" fill="#1d5fbf"/></svg></i>InvoiceFlow</a>
    <a class="btn top-btn primary" href="#new/invoice">+ New invoice</a>
    <a class="btn top-btn" href="#new/order">+ New order</a>
    <a class="btn top-btn" href="#new/quote">+ New quote</a>
    <a class="syncchip" id="syncChip" href="#settings" hidden></a>
    <button class="btn top-btn" type="button" data-act="theme" id="themeBtn" title="Switch light / dark">Theme</button>
  </header>
  <aside class="side"><nav id="nav"></nav></aside>
  <main class="main" id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<input type="file" id="fileImport" accept=".csv,text/csv" multiple hidden>

<script>
(function(){
'use strict';

/* ---------- small helpers ---------- */
var KEY='invoiceflow.v1', THEME_KEY='invoiceflow.theme';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nl=function(s){return esc(s).replace(/\n/g,'<br>')};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)};
var round2=function(n){return Math.round((n+Number.EPSILON)*100)/100};
var clone=function(x){return JSON.parse(JSON.stringify(x))};
var pad=function(n){return String(n).padStart(2,'0')};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoOf(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function todayISO(){return isoOf(new Date())}
function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(iso,n){var d=parseISO(iso);d.setDate(d.getDate()+n);return isoOf(d)}
function daysBetween(a,b){var x=parseISO(a),y=parseISO(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)}
function fdate(iso){if(!iso)return '';var p=iso.split('-');return (+p[2])+' '+MONTHS[p[1]-1]+' '+p[0]}
function fqty(q){return String(+(+q).toFixed(3))}

function fmt(n){
  n=round2(+n||0);var neg=n<0;var p=Math.abs(n).toFixed(2).split('.');
  return (neg?'-':'')+S.settings.currency+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'.'+p[1];
}

/* ---------- money maths ---------- */
function lineAmt(l){return (+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100)}
function calc(d){
  var r=(+S.settings.taxRate||0)/100,incl=!!S.settings.pricesInclTax,net=0,taxable=0;
  d.lines.forEach(function(l){
    var a=lineAmt(l),n=(incl&&l.tax)?a/(1+r):a;
    net+=n;if(l.tax)taxable+=n;
  });
  var dp=(+d.discount||0)/100,disc=net*dp,after=net-disc,tax=taxable*(1-dp)*r,ship=+d.shipping||0;
  var total=after+tax+ship,paid=0,credit=0,refunded=0;
  (d.payments||[]).forEach(function(p){paid+=+p.amount||0});
  (d.credits||[]).forEach(function(c){credit+=+c.amount||0});
  (d.refunds||[]).forEach(function(r){refunded+=+r.amount||0});
  return{net:round2(net),disc:round2(disc),after:round2(after),tax:round2(tax),ship:round2(ship),total:round2(total),paid:round2(paid),credit:round2(credit),refunded:round2(refunded),balance:round2(total-credit-(paid-refunded))};
}
function status(d){
  var t=todayISO();
  if(d.type==='quote'){
    if(d.status==='invoiced')return 'Invoiced';
    if(d.status==='accepted')return 'Accepted';
    if(d.status==='declined')return 'Declined';
    return (d.due&&d.due<t)?'Expired':'Open';
  }
  if(d.type==='order'){
    if(d.status==='invoiced')return 'Invoiced';
    if(d.status==='cancelled')return 'Cancelled';
    return 'Open';
  }
  var c=calc(d);
  if(c.balance<-0.004)return 'Credit';
  if(c.balance<=0.004)return 'Paid';
  if(d.due&&d.due<t)return 'Overdue';
  return c.paid>0?'Part paid':'Unpaid';
}
function badge(st){
  var m={'Paid':'good','Unpaid':'neutral','Part paid':'warn','Overdue':'bad','Open':'neutral','Accepted':'good','Declined':'bad','Invoiced':'accent','Expired':'warn','Cancelled':'bad','Credit':'accent'};
  return '<span class="badge '+(m[st]||'neutral')+'">'+st+'</span>';
}

/* ---------- toast + dialogs ---------- */
function toast(msg,kind){
  var t=document.createElement('div');t.className='toast'+(kind==='bad'?' bad':'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(function(){t.remove()},kind==='bad'?5200:2600);
}
function modal(title,body,o){
  o=o||{};
  var dlg=document.createElement('dialog');dlg.className='modal'+(o.wide?' wide':'');
  dlg.innerHTML='<form class="mform"><header><h2>'+title+'</h2><button type="button" class="x" data-close aria-label="Close">&times;</button></header><div class="mbody">'+body+'</div><footer>'+
    (o.cancel===false?'':'<button type="button" class="btn" data-close>'+(o.cancel||'Cancel')+'</button>')+
    (o.hideOk?'':'<button type="submit" class="btn primary">'+(o.ok||'Save')+'</button>')+'</footer></form>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',function(){dlg.remove()});
  dlg.addEventListener('click',function(e){if(e.target.closest('[data-close]'))dlg.close();else if(e.target===dlg)dlg.close()});
  dlg.querySelector('form').addEventListener('submit',function(e){
    e.preventDefault();
    if(o.onOk&&o.onOk(dlg)===false)return;
    dlg.close();
  });
  dlg.showModal();
  var f=dlg.querySelector('input:not([type=hidden]),select,textarea');if(f)f.focus();
  return dlg;
}
function formData(dlg){var o={};new FormData(dlg.querySelector('form')).forEach(function(v,k){o[k]=v});return o}
function ask(title,msg,okLabel){
  return new Promise(function(res){
    var done=false;var d=modal(title,'<p>'+msg+'</p>',{ok:okLabel||'Delete',onOk:function(){done=true}});
    d.addEventListener('close',function(){res(done)});
  });
}

/* ---------- routing ---------- */
var main=function(){return $('#main')};
function stmtDue(){
  var a=S.settings.autoStmt;if(!a||!a.on)return false;
  var t=todayISO();if(a.last===t.slice(0,7))return false;
  return +t.slice(8)>=(+a.day||1);
}
function banner(){
  var out='';
  if(stmtDue())out+='<div class="banner noprint"><span>Your monthly statements are due. Run them now and send them to customers who owe you.</span><a class="btn sm" href="#statements">Run statements</a></div>';
  if(!S.docs.length&&!S.customers.length)return out;
  var lb=S.settings.lastBackup;
  if(lb&&daysBetween(lb,todayISO())<=14)return out;
  return out+'<div class="banner noprint"><span>'+(lb?'Your last backup was on '+fdate(lb)+'.':'You have not downloaded a backup yet.')+' Your invoices are stored in this browser only. A backup protects them if the computer or browser is cleared.</span><button class="btn sm" data-act="backup">Download backup now</button></div>';
}
function setMain(html){main().innerHTML=banner()+html}
function route(){
  var h=location.hash.slice(1)||'dashboard',p=h.split('/'),name=p[0],a=p[1],b=p[2];
  var nav=name;
  if(name==='new')nav=T(a).plural;
  if(name==='edit'||name==='view'){var d=docById(a);nav=d?T(d.type).plural:'invoices'}
  if(name==='customer'||name==='statement')nav='customers';
  drawNav(nav);
  draft=name==='new'||name==='edit'?draft:null;
  var V={dashboard:vDashboard,invoices:function(){vDocs('invoice')},quotes:function(){vDocs('quote')},orders:function(){vDocs('order')},statements:vStatements,customers:vCustomers,
    customer:function(){vCustomer(a)},items:vItems,payments:vPayments,reports:vReports,settings:vSettings,
    view:function(){vView(a)},statement:function(){vStatement(a)},
    'new':function(){vEditor(a,null,b)},edit:function(){vEditor(null,a)}};
  (V[name]||vDashboard)();
  window.scrollTo(0,0);
}

/* ---------- dashboard ---------- */
function vDashboard(){
  var inv=invoices(),t=todayISO(),ym=t.slice(0,7),out=0,over=0,invM=0,rcvM=0;
  inv.forEach(function(d){
    var c=calc(d);
    if(c.balance>0.004){out+=c.balance;if(d.due&&d.due<t)over+=c.balance}
    if(d.date.slice(0,7)===ym)invM+=c.total;
    d.payments.forEach(function(p){if(p.date.slice(0,7)===ym)rcvM+=+p.amount});
  });
  var fresh=!S.docs.length&&!S.customers.length;
  var welcome=fresh?'<div class="card pad" style="margin-bottom:16px"><h2>Welcome. Start here.</h2><ol class="steps"><li>Open <a href="#settings">Settings</a> and type in your company name, address, VAT number and banking details.</li><li>Add your first customer on the <a href="#customers">Customers</a> page.</li><li>Click <b>+ New invoice</b> at the top, choose the customer, add your lines and save.</li></ol><p class="note" style="margin:10px 0 0">Moving from another program? <button class="btn sm" data-act="import">Import history (CSV files)</button> Want to look around first? <button class="btn sm" data-act="sample">Load sample data</button> You can erase it later in Settings.</p></div>':'';
  var months=[];
  for(var i=5;i>=0;i--){var dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()-i);months.push({k:dt.getFullYear()+'-'+pad(dt.getMonth()+1),l:MONTHS[dt.getMonth()],inv:0,rec:0})}
  inv.forEach(function(d){var m=months.find(function(x){return x.k===d.date.slice(0,7)});if(m)m.inv+=calc(d).total;
    d.payments.forEach(function(p){var m2=months.find(function(x){return x.k===p.date.slice(0,7)});if(m2)m2.rec+=+p.amount})});
  var mx=Math.max.apply(null,months.map(function(m){return Math.max(m.inv,m.rec)}).concat([1]));
  var bars=months.map(function(m){return '<div class="m"><div class="pair"><div class="b" style="height:'+(m.inv/mx*100)+'%" title="Invoiced '+fmt(m.inv)+'"></div><div class="b r" style="height:'+(m.rec/mx*100)+'%" title="Received '+fmt(m.rec)+'"></div></div><small>'+m.l+'</small></div>'}).join('');
  var recent=inv.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.number.localeCompare(a.number)}).slice(0,6);
  var ovl=inv.filter(function(d){return status(d)==='Overdue'}).sort(function(a,b){return a.due.localeCompare(b.due)}).slice(0,6);
  var row=function(d){var c=calc(d);return '<tr data-href="view/'+d.id+'"><td><b>'+esc(d.number)+'</b></td><td>'+esc(custName(d.customerId))+'</td><td>'+fdate(d.date)+'</td><td class="num">'+fmt(c.total)+'</td><td>'+badge(status(d))+'</td></tr>'};
  var orow=function(d){var c=calc(d);return '<tr data-href="view/'+d.id+'"><td><b>'+esc(d.number)+'</b></td><td>'+esc(custName(d.customerId))+'</td><td>'+daysBetween(d.due,t)+' days late</td><td class="num">'+fmt(c.balance)+'</td></tr>'};
  setMain('<div class="head"><div><h1>Dashboard</h1><p class="sub">'+esc(S.settings.company||'Your business')+' &middot; '+fdate(t)+'</p></div></div>'+welcome+
    '<div class="stats"><div class="card stat"><small>Outstanding</small><b>'+fmt(out)+'</b></div><div class="card stat bad"><small>Overdue</small><b>'+fmt(over)+'</b></div><div class="card stat"><small>Invoiced this month</small><b>'+fmt(invM)+'</b></div><div class="card stat good"><small>Received this month</small><b>'+fmt(rcvM)+'</b></div></div>'+
    '<div class="two"><div class="card"><div class="ch"><h2>Last 6 months</h2></div><div class="bars">'+bars+'</div><div class="legend"><span><i></i>Invoiced</span><span><i class="r"></i>Received</span></div></div>'+
    '<div class="card"><div class="ch"><h2>Overdue invoices</h2></div>'+(ovl.length?'<div class="tw"><table class="tbl"><tbody>'+ovl.map(orow).join('')+'</tbody></table></div>':'<div class="empty">Nothing is overdue.</div>')+'</div></div>'+

}

var draft=null;

function newDraft(type,custId){
  var s=S.settings,t=todayISO(),isInv=type==='invoice',c=custId?cust(custId):null;
  var terms=isInv?((c&&c.termsDays!==''&&c.termsDays!=null)?+c.termsDays:+s.termsDays):type==='order'?7:+s.quoteDays;
  return{id:uid(),type:type,number:nextNumber(type),customerId:custId||'',date:t,terms:terms,due:addDays(t,terms),ref:'',salesperson:'',lines:[blankLine()],discount:0,shipping:0,notes:isInv?s.invNotes:type==='quote'?s.quoteNotes:'',payments:[],credits:[],refunds:[],status:'open',isNew:true,createdAt:Date.now()};
}
function onHand(it){
  var n=+it.start||0;(it.moves||[]).forEach(function(m){n+=+m.qty||0});
  S.docs.forEach(function(d){
    if(d.type!=='invoice')return;
    d.lines.forEach(function(l){if(l.itemId===it.id)n-=+l.qty||0});
    (d.credits||[]).forEach(function(c){(c.restock||[]).forEach(function(r){if(r.itemId===it.id)n+=+r.qty||0})});
  });
  return Math.round(n*1000)/1000;
}
function salespeople(){var m={};S.docs.forEach(function(d){if(d.salesperson)m[d.salesperson]=1});return Object.keys(m).sort()}
var TERMS=[0,7,14,21,30,45,60,90];
function termsOptions(d){

function custOptions(sel){

    '<div class="field"><label for="e-terms">'+(isInv?'Payment terms':draft.type==='order'?'Required in':'Valid for')+'</label><select id="e-terms" data-f="terms">'+termsOptions(draft)+'</select></div>'+
    '<div class="field"><label for="e-due">'+dueLabel(draft.type)+'</label><input id="e-due" type="date" data-f="due" value="'+draft.due+'"></div>'+

    '<div class="tw"><table class="lines"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Disc %</th><th style="text-align:center">'+esc(s.taxName)+'</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>'+

    '<div style="margin-top:10px"><button class="btn sm" type="button" data-act="add-line">+ Add line</button> '+(S.items.length?'':'<span class="note">Tip: save the things you sell on the Items page and they will fill in here.</span>')+'</div>'+
    '<div class="bottom"><div class="field"><label for="e-notes">Notes shown on the '+w+'</label><textarea id="e-notes" data-f="notes" rows="4">'+esc(draft.notes)+'</textarea>'+(s.pricesInclTax?'<p class="note">Prices on this '+w+' include '+esc(s.taxName)+'.</p>':'')+'</div>'+
    '<table class="tot"><tr><td>Subtotal</td><td id="t-net"></td></tr><tr><td>Discount %</td><td><input data-f="discount" type="number" step="any" min="0" max="100" value="'+esc(draft.discount||'')+'" aria-label="Discount percent on whole document"> <span id="t-disc"></span></td></tr><tr><td>Delivery</td><td><input data-f="shipping" type="number" step="0.01" min="0" value="'+esc(draft.shipping||'')+'" aria-label="Delivery charge"></td></tr>'+
    (s.taxRate>0?'<tr><td>'+esc(s.taxName)+' ('+fqty(s.taxRate)+'%)</td><td id="t-tax"></td></tr>':'')+
    '<tr class="grand"><td>Total</td><td id="t-total"></td></tr>'+(isInv&&draft.payments.length?'<tr><td>Paid</td><td id="t-paid"></td></tr><tr class="due"><td>Balance due</td><td id="t-bal"></td></tr>':'')+'</table></div></div>');

function renderLines(){$('#lines').innerHTML=draft.lines.map(lineRow).join('')}
function recalcUI(i){
  var c=calc(draft),set=function(id,v){var e=$(id);if(e)e.textContent=v};
  set('#t-net',fmt(c.net));set('#t-disc',c.disc?'-'+fmt(c.disc):'');set('#t-tax',fmt(c.tax));set('#t-total',fmt(c.total));set('#t-paid','-'+fmt(c.paid));set('#t-bal',fmt(c.balance));
  if(i!=null){var row=$('#lines tr[data-i="'+i+'"] .amt');if(row)row.textContent=fmt(lineAmt(draft.lines[i]))}
}
function syncTerms(){
  var diff=daysBetween(draft.date,draft.due);draft.terms=diff;
  $('#e-terms').value=TERMS.indexOf(diff)>-1?String(diff):'custom';
}
function onEd(e){
  var t=e.target,f=t.dataset.f,lf=t.dataset.lf;
  if(lf){
    var tr=t.closest('tr'),i=+tr.dataset.i,l=draft.lines[i];
    if(lf==='tax')l.tax=t.checked;
    else if(lf==='desc'){l.desc=t.value;if(l.itemId){var cur=S.items.find(function(x){return x.id===l.itemId});if(!cur||cur.name!==t.value)delete l.itemId}if(e.type==='change')fillFromItem(i,tr)}
    else l[lf]=t.value;
    recalcUI(i);return;
  }
  if(!f)return;
  var v=t.value;
  if(f==='customerId'){
    draft.customerId=v;var c=cust(v);
    if(c&&draft.type==='invoice'&&c.termsDays!==''&&c.termsDays!=null&&draft.isNew){draft.due=addDays(draft.date,+c.termsDays);$('#e-due').value=draft.due;syncTerms()}
  }
  else if(f==='date'){if(!v)return;draft.date=v;if(draft.terms!=null&&$('#e-terms').value!=='custom'){draft.due=addDays(v,+$('#e-terms').value);$('#e-due').value=draft.due}else syncTerms()}
  else if(f==='terms'){if(v==='custom'){$('#e-due').focus();return}draft.due=addDays(draft.date,+v);$('#e-due').value=draft.due;draft.terms=+v}
  else if(f==='due'){if(!v)return;draft.due=v;syncTerms()}
  else{draft[f]=v}
  recalcUI();
}
function fillFromItem(i,tr){
  var l=draft.lines[i],val=l.desc.trim().toLowerCase();if(!val)return;
  var it=S.items.find(function(x){return x.name.toLowerCase()===val||(x.code&&x.code.toLowerCase()===val)});
  if(!it)return;
  l.desc=it.name;l.price=it.price;l.tax=!!it.tax&&(+S.settings.taxRate>0);l.itemId=it.id;
  if(it.track&&draft.type==='invoice'){var oh=onHand(it);if(oh<=0)toast(it.name+' is out of stock.','bad');else if(+it.reorder>0&&oh<=+it.reorder)toast('Low stock: only '+fqty(oh)+' of '+it.name+' left.')}
  tr.querySelector('[data-lf=desc]').value=l.desc;tr.querySelector('[data-lf=price]').value=l.price;tr.querySelector('[data-lf=tax]').checked=l.tax;
}
function commitDraft(){
  var d=draft;
  if(!d.customerId){toast('Choose a customer first.','bad');$('#e-cust').focus();return null}
  var keep=d.lines.filter(function(l){return String(l.desc).trim()||+l.price});
  if(!keep.length){toast('Add at least one line with a description or price.','bad');return null}
  d.number=String(d.number).trim();
  if(!d.number){toast('Please type a number.','bad');return null}
  if(S.docs.some(function(x){return x.type===d.type&&x.number===d.number&&x.id!==d.id})){toast('That number is already used. Pick a different one.','bad');return null}
  d.lines=keep.map(function(l){var o={desc:String(l.desc).trim(),qty:+l.qty||0,price:+l.price||0,disc:+l.disc||0,tax:!!l.tax};if(l.itemId)o.itemId=l.itemId;return o});
  d.discount=+d.discount||0;d.shipping=+d.shipping||0;
  if(d.isNew&&d.number===nextNumber(d.type))bumpNumber(d.type);
  var wasNew=d.isNew;delete d.isNew;
  var idx=S.docs.findIndex(function(x){return x.id===d.id});
  if(idx>-1)S.docs[idx]=d;else S.docs.push(d);
  save();draft=null;toast(T(d.type).Word+' '+d.number+' saved');
  return d;
}

function statementHTML(id,from){
  var c=cust(id)||{name:''},tx=[];
  invoices().filter(function(d){return d.customerId===id}).forEach(function(d){
    tx.push({date:d.date,o:0,type:'Invoice',ref:d.number,dr:calc(d).total,cr:0});
    d.payments.forEach(function(p){tx.push({date:p.date,o:1,type:'Payment',ref:d.number+(p.ref?' ('+p.ref+')':''),dr:0,cr:+p.amount})});
    (d.credits||[]).forEach(function(c){tx.push({date:c.date,o:2,type:'Credit',ref:d.number+(c.reason?' ('+c.reason+')':''),dr:0,cr:+c.amount})});
    (d.refunds||[]).forEach(function(r){tx.push({date:r.date,o:3,type:'Refund',ref:d.number,dr:+r.amount,cr:0})});
  });
  tx.sort(function(a,b){return a.date.localeCompare(b.date)||a.o-b.o});
  var open=0;tx.forEach(function(t){if(from&&t.date<from)open+=t.dr-t.cr});
  var bal=open,rows=tx.filter(function(t){return !from||t.date>=from}).map(function(t){bal+=t.dr-t.cr;return '<tr><td>'+fdate(t.date)+'</td><td>'+t.type+'</td><td>'+esc(t.ref)+'</td><td class="r">'+(t.dr?fmt(t.dr):'')+'</td><td class="r">'+(t.cr?fmt(t.cr):'')+'</td><td class="r"><b>'+fmt(bal)+'</b></td></tr>'}).join('');
  var ag=[0,0,0,0,0],today=todayISO();
  invoices().filter(function(d){return d.customerId===id}).forEach(function(d){var b=calc(d).balance;if(b<=0.004)return;var o=daysBetween(d.due,today);ag[o<=0?0:o<=30?1:o<=60?2:o<=90?3:4]+=b});
  return '<div class="paper"><div class="p-head"><div class="p-co">'+companyBlock()+'</div><div class="p-doc"><div class="p-title">STATEMENT</div><table class="p-meta"><tr><td>Date</td><td>'+fdate(today)+'</td></tr>'+(from?'<tr><td>From</td><td>'+fdate(from)+'</td></tr>':'')+'</table></div></div>'+
    '<div class="p-parties"><div><h4>Statement for</h4><b>'+esc(c.name)+'</b><br>'+nl(c.address||'')+'</div><div></div></div>'+
    '<table class="p-lines"><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="r">Charges</th><th class="r">Payments / credits</th><th class="r">Balance</th></tr></thead><tbody>'+(from?'<tr><td colspan="5"><i>Balance brought forward</i></td><td class="r"><b>'+fmt(open)+'</b></td></tr>':'')+(rows||'<tr><td colspan="6">No activity.</td></tr>')+'</tbody></table>'+
    '<div class="p-foot"><div>'+(S.settings.bank?'<div class="p-box" style="margin-top:0"><h4>Banking details</h4>'+nl(S.settings.bank)+'</div>':'')+'</div><table class="p-tot"><tr class="d"><td>Amount due</td><td>'+fmt(bal)+'</td></tr></table></div>'+
    '<table class="p-lines" style="margin-top:22px"><thead><tr><th class="r">Current</th><th class="r">1-30 days</th><th class="r">31-60 days</th><th class="r">61-90 days</th><th class="r">90+ days</th></tr></thead><tbody><tr>'+ag.map(function(x){return '<td class="r">'+fmt(x)+'</td>'}).join('')+'</tr></tbody></table></div>';
}

function openInvoices(custId){return invoices().filter(function(d){return d.customerId===custId&&calc(d).balance>0.004}).sort(function(a,b){return a.date.localeCompare(b.date)||String(a.number).localeCompare(String(b.number),undefined,{numeric:true})})}
function allocate(custId,amount){
  var open=openInvoices(custId),left=round2(amount),out=[];
  open.forEach(function(d){if(left<=0.004)return;var b=calc(d).balance,x=Math.min(b,left);out.push({d:d,amt:round2(x)});left=round2(left-x)});
  var extra=0;if(left>0.004){extra=left;if(out.length)out[out.length-1].amt=round2(out[out.length-1].amt+left)}
  return{rows:out,extra:extra,owing:round2(open.reduce(function(s,d){return s+calc(d).balance},0))};
}
function applyPayModal(custId){
  var withDebt=S.customers.filter(function(c){return custBalance(c.id)>0.004}).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(!withDebt.length){toast('Nobody owes you anything right now.');return}
  var pick=custId&&custBalance(custId)>0.004?custId:withDebt[0].id;
  var dlg=modal('Apply payment','<p class="note" style="margin-top:0">Use this when a customer pays you an amount that covers several invoices. The money is applied to their oldest invoice first.</p>'+
    '<div class="field"><label>Customer</label><select name="cust" id="ap-c">'+withDebt.map(function(c){return '<option value="'+c.id+'"'+(c.id===pick?' selected':'')+'>'+esc(c.name)+' (owes '+fmt(custBalance(c.id))+')</option>'}).join('')+'</select></div>'+
    '<div class="grid2"><div class="field"><label>Date</label><input type="date" name="date" required value="'+todayISO()+'"></div><div class="field"><label>Amount received ('+esc(S.settings.currency)+')</label><input type="number" name="amount" id="ap-a" step="0.01" min="0.01" required></div></div>'+
    '<div class="grid2"><div class="field"><label>Method</label><select name="method"><option>EFT</option><option>Cash</option><option>Card</option><option>Cheque</option><option>Other</option></select></div><div class="field"><label>Reference</label><input name="ref" placeholder="Optional"></div></div>'+
    '<div id="ap-prev" class="note"></div>',
    {ok:'Apply payment',wide:true,onOk:function(d){
      var f=formData(d),amt=round2(+f.amount);if(!(amt>0))return false;
      var al=allocate(f.cust,amt);if(!al.rows.length)return false;
      al.rows.forEach(function(r){r.d.payments.push({id:uid(),date:f.date,amount:r.amt,method:f.method,ref:f.ref.trim()})});
      save();toast('Payment of '+fmt(amt)+' applied to '+al.rows.length+' invoice'+(al.rows.length>1?'s':''));route();
    }});
  var prev=function(){

function rangeOf(){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth(),p=R.range;
  if(p==='this-month')return[isoOf(new Date(y,m,1)),isoOf(new Date(y,m+1,0))];
  if(p==='last-month')return[isoOf(new Date(y,m-1,1)),isoOf(new Date(y,m,0))];
  if(p==='this-quarter'){var q=Math.floor(m/3)*3;return[isoOf(new Date(y,q,1)),isoOf(new Date(y,q+3,0))]}
  if(p==='this-year')return[y+'-01-01',y+'-12-31'];

/* ---------- CSV import (history from another program) ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  rows=rows.filter(function(r){return r.length>1||(r[0]&&r[0].trim())});
  var hdr=(rows.shift()||[]).map(function(h){return h.trim().toLowerCase()});
  return{hdr:hdr,rows:rows.map(function(r){var o={};hdr.forEach(function(h,j){o[h]=(r[j]||'').trim()});return o})};
}
function csvKind(h){
  var has=function(x){return h.indexOf(x)>-1};
  if(has('price')&&has('name'))return 'items';
  if(has('customer')&&has('total'))return has('valid_until')?'quotes':'invoices';
  if(has('name')&&(has('address')||has('email')))return 'customers';
  return '';
}
var KIND_LABEL={customers:'customers',items:'items',invoices:'invoices',quotes:'quotes'};
function importFiles(files){
  files=Array.prototype.slice.call(files||[]);if(!files.length)return;
  Promise.all(files.map(function(f){return f.text().then(function(t){return{name:f.name,p:parseCSV(t)}})})).then(function(list){
    var sets={customers:[],items:[],invoices:[],quotes:[]},unknown=[];
    list.forEach(function(x){var k=csvKind(x.p.hdr);if(k)sets[k]=sets[k].concat(x.p.rows);else unknown.push(x.name)});
    var n=sets.customers.length+sets.items.length+sets.invoices.length+sets.quotes.length;
    if(!n){toast('None of those files look like InvoiceFlow import files.','bad');return}
    var line=function(k){return sets[k].length?'<li><b>'+sets[k].length+'</b> '+KIND_LABEL[k]+'</li>':''};
    modal('Import history','<p>Ready to import:</p><ul class="steps" style="margin:0">'+line('customers')+line('items')+line('invoices')+line('quotes')+'</ul>'+
      (unknown.length?'<p class="note">Not recognised, so skipped: '+unknown.map(esc).join(', ')+'</p>':'')+
      '<p class="note">Anything already in the program (same customer name, or same invoice / quote number) is skipped, so it is safe to import the same files twice.</p>',
      {ok:'Import now',onOk:function(){runImport(sets)}});
  }).catch(function(){toast('Could not read those files.','bad')});
}
function pickNumbering(nums){
  var best=null;
  nums.forEach(function(n){var m=/^(\D*)(\d+)$/.exec(n);if(!m)return;var v=+m[2];if(!best||v>best.v)best={v:v,prefix:m[1],pad:m[2].length}});
  return best;
}
function runImport(sets){
  var rep={cust:0,custSkip:0,items:0,itemSkip:0,inv:0,invSkip:0,qt:0,qtSkip:0,pay:0,newCust:[],bad:[]};
  var ck=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')};
  var cmap={};S.customers.forEach(function(c){cmap[ck(c.name)]=c});
  sets.customers.forEach(function(r){
    if(!r.name)return;var key=ck(r.name);
    if(cmap[key]){rep.custSkip++;return}
    var c={id:uid(),name:r.name,contact:r.contact||'',email:r.email||'',phone:r.phone||'',address:r.address||'',taxNo:r.tax_no||'',termsDays:(r.terms_days===''||r.terms_days==null)?'':(+r.terms_days||0),notes:r.notes||''};
    S.customers.push(c);cmap[key]=c;rep.cust++;
  });
  var ik={};S.items.forEach(function(i){ik[ck(i.code+'|'+i.name)]=1});
  sets.items.forEach(function(r){
    if(!r.name)return;var key=ck((r.code||'')+'|'+r.name);
    if(ik[key]){rep.itemSkip++;return}
    S.items.push({id:uid(),code:r.code||'',name:r.name,price:+r.price||0,tax:/^(y|yes|true|1)$/i.test(r.taxable||'')});ik[key]=1;rep.items++;
  });
  var imported={invoice:[],quote:[]};
  function docs(rows,type){
    var isInv=type==='invoice';
    rows.forEach(function(r){
      var num=r.number;
      if(!num){rep.bad.push('A row without a number was skipped');return}
      if(S.docs.some(function(d){return d.type===type&&d.number===num})){isInv?rep.invSkip++:rep.qtSkip++;return}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||isNaN(+r.total)||r.total===''){rep.bad.push((isInv?'Invoice ':'Quote ')+num+' has a bad date or total and was skipped');return}
      var c=cmap[ck(r.customer)];
      if(!c){c={id:uid(),name:r.customer||'(no name)',contact:'',email:'',phone:'',address:'',taxNo:'',termsDays:'',notes:''};S.customers.push(c);cmap[ck(r.customer)]=c;rep.newCust.push(c.name)}
      var date=r.date,due=/^\d{4}-\d{2}-\d{2}$/.test((isInv?r.due_date:r.valid_until)||'')?(isInv?r.due_date:r.valid_until):addDays(date,isInv?+S.settings.termsDays:+S.settings.quoteDays);
      var st=(r.status||'').toLowerCase();
      var d={id:uid(),type:type,number:num,customerId:c.id,date:date,terms:daysBetween(date,due),due:due,ref:'',salesperson:r.salesperson||'',
        lines:[{desc:r.description||'Imported from previous system',qty:1,price:+r.total,disc:0,tax:false}],discount:0,shipping:0,notes:'',payments:[],
        status:(!isInv&&['accepted','declined','invoiced'].indexOf(st)>-1)?st:'open',imported:true,createdAt:Date.now()};
      var paid=+r.paid||0;
      if(isInv&&paid>0){d.payments.push({id:uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(r.paid_date||'')?r.paid_date:date,amount:round2(paid),method:'Imported',ref:'Previous system'});rep.pay++}
      S.docs.push(d);imported[type].push(num);isInv?rep.inv++:rep.qt++;
    });
  }
  docs(sets.invoices,'invoice');docs(sets.quotes,'quote');
  var s=S.settings,msgs=[];
  var ni=pickNumbering(imported.invoice),nq=pickNumbering(imported.quote);
  if(ni&&s.invPrefix==='INV-'&&+s.invNext===1){s.invPrefix=ni.prefix;s.invNext=ni.v+1;s.invPad=ni.pad;msgs.push('Your next invoice number is now <b>'+esc(nextNumber('invoice'))+'</b>.')}
  if(nq&&s.quotePrefix==='QUO-'&&+s.quoteNext===1){s.quotePrefix=nq.prefix;s.quoteNext=nq.v+1;s.quotePad=nq.pad;msgs.push('Your next quote number is now <b>'+esc(nextNumber('quote'))+'</b>.')}
  if(rep.inv&&+s.taxRate>0)msgs.push('The imported invoices have no '+esc(s.taxName)+' added. New invoices will add '+esc(s.taxName)+' at '+fqty(s.taxRate)+'%. If your business does not charge it, set the tax rate to 0 in Settings.');
  save();
  var li=function(n,skip,w){return (n||skip)?'<li>'+w+': <b>'+n+'</b> added'+(skip?', '+skip+' already there':'')+'</li>':''};
  modal('Import finished','<ul class="steps" style="margin:0">'+li(rep.cust,rep.custSkip,'Customers')+li(rep.items,rep.itemSkip,'Items')+li(rep.inv,rep.invSkip,'Invoices')+li(rep.qt,rep.qtSkip,'Quotes')+'</ul>'+
    (rep.pay?'<p class="note">'+rep.pay+' payments were recorded as "Imported" on the invoice date, because the old reports do not show the payment dates.</p>':'')+
    msgs.map(function(m){return '<p>'+m+'</p>'}).join('')+
    (rep.newCust.length?'<p class="note">Customers created automatically because they were not in the customer list: '+rep.newCust.slice(0,10).map(esc).join(', ')+(rep.newCust.length>10?' and more':'')+'</p>':'')+
    (rep.bad.length?'<p class="note">'+rep.bad.slice(0,6).map(esc).join('<br>')+(rep.bad.length>6?'<br>and '+(rep.bad.length-6)+' more':'')+'</p>':''),
    {cancel:'Close',hideOk:true});
  route();
}

/* ---------- document actions ---------- */
function delDoc(id){
  var d=docById(id);if(!d)return;
  var w=T(d.type).word,extra=d.payments&&d.payments.length?' This invoice has payments recorded against it, and they will be deleted too.':'';
  ask('Delete '+w,'Delete '+w+' <b>'+esc(d.number)+'</b> for '+esc(custName(d.customerId))+'?'+extra+' This cannot be undone.').then(function(ok){
    if(!ok)return;S.docs=S.docs.filter(function(x){return x.id!==id});save();toast('Deleted');
    var h=location.hash;if(h.indexOf('#view/')===0||h.indexOf('#edit/')===0)location.hash='#'+T(d.type).plural;else route();
  });
}
function dupDoc(id){
  var d=docById(id);if(!d)return;
  var n=clone(d),t=todayISO();
  n.id=uid();n.number=nextNumber(d.type);n.date=t;n.due=addDays(t,Math.max(0,+d.terms||daysBetween(d.date,d.due)));n.payments=[];n.credits=[];n.refunds=[];n.status='open';n.createdAt=Date.now();delete n.fromQuote;
  bumpNumber(d.type);S.docs.push(n);save();toast('Copy created as '+n.number);location.hash='#edit/'+n.id;
}
function convertQuote(id){
  var q=docById(id);if(!q)return;
  var t=todayISO(),terms=+S.settings.termsDays,c=cust(q.customerId);
  if(c&&c.termsDays!==''&&c.termsDays!=null)terms=+c.termsDays;
  var inv={id:uid(),type:'invoice',number:nextNumber('invoice'),customerId:q.customerId,date:t,terms:terms,due:addDays(t,terms),ref:q.ref||q.number,salesperson:q.salesperson||'',lines:clone(q.lines),discount:q.discount,shipping:q.shipping,notes:S.settings.invNotes,payments:[],credits:[],refunds:[],status:'open',fromQuote:q.id,createdAt:Date.now()};
  bumpNumber('invoice');S.docs.push(inv);q.status='invoiced';save();toast('Invoice '+inv.number+' created from '+q.number);location.hash='#view/'+inv.id;
}

/* ---------- global event handling ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){
    var a=t.dataset.act,id=t.dataset.id;
    switch(a){
      case 'theme':cycleTheme();break;
      case 'new-cust':custModal();break;
      case 'edit-cust':custModal(id);break;
      case 'new-cust-ed':custModal(null,function(rec){draft.customerId=rec.id;var sel=$('#e-cust');sel.innerHTML=custOptions(rec.id);if(draft.type==='invoice'&&draft.isNew&&rec.termsDays!==''){draft.due=addDays(draft.date,+rec.termsDays);$('#e-due').value=draft.due;syncTerms()}});break;
      case 'del-cust':
        if(S.docs.some(function(d){return d.customerId===id})){toast('This customer has invoices or quotes. Delete those first.','bad');break}
        ask('Delete customer','Delete <b>'+esc(custName(id))+'</b>? This cannot be undone.').then(function(ok){if(ok){S.customers=S.customers.filter(function(c){return c.id!==id});save();toast('Customer deleted');location.hash='#customers'}});break;
      case 'new-item':itemModal();break;
      case 'edit-item':itemModal(id);break;
      case 'del-item':ask('Delete item','Delete this item? Invoices that already use it are not changed.').then(function(ok){if(ok){S.items=S.items.filter(function(i){return i.id!==id});save();route()}});break;
      case 'pay':e.stopPropagation();payModal(id);break;
      case 'del-payment':e.stopPropagation();ask('Delete payment','Delete this payment? The invoice balance will go back up.').then(function(ok){if(ok){var d=docById(id);d.payments=d.payments.filter(function(p){return p.id!==t.dataset.p});save();route()}});break;
      case 'refund':e.stopPropagation();refundModal(id);break;
      case 'apply-pay':e.stopPropagation();applyPayModal(id||'');break;
      case 'adj-stock':stockModal(id);break;
      case 'wa':waDoc(docById(id));break;
      case 'sync-connect':syConnect($('#sy-url').value,$('#sy-pass').value);break;
      case 'sync-now':syMsg='';syChip();if(SY.dirty)syPush();else syPull().then(function(){toast('Checked. Everything is up to date.')});break;
      case 'sync-off':ask('Disconnect','Disconnect this computer from the online copy? Your data stays on this computer and online, but they will no longer match automatically.','Disconnect').then(function(ok){if(ok){SY=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}syChip();route()}});break;
      case 'stmt-wa':waStatement(id);break;
      case 'stmt-mail':var sc=cust(id),sb=custBalance(id),ss=S.settings;emailModal('Statement from '+(ss.company||'us'),'Hi '+(sc.contact||sc.name)+',\n\nPlease find attached your statement. The amount due is '+fmt(sb)+'.\n\n'+(ss.bank?'Banking details:\n'+ss.bank+'\n\n':'')+'Kind regards,\n'+(ss.company||''),sc.email,'Statement - '+sc.name,'statement');break;
      case 'pay-tab':PT=t.dataset.tab;route();break;
      case 'del-refund':e.stopPropagation();ask('Delete refund','Delete this refund record? The invoice balance will change back.').then(function(ok){if(ok){var d=docById(id);d.refunds=d.refunds.filter(function(r){return r.id!==t.dataset.p});save();route()}});break;
      case 'del-credit':e.stopPropagation();ask('Delete credit','Delete this return / credit? The invoice balance will go back up.').then(function(ok){if(ok){var d=docById(id);d.credits=d.credits.filter(function(r){return r.id!==t.dataset.p});save();route()}});break;
      case 'del-doc':e.stopPropagation();delDoc(id);break;
      case 'dup-doc':dupDoc(id);break;
      case 'convert':convertQuote(id);break;
      case 'quote-status':var q=docById(id);q.status=t.dataset.s;save();toast(T(q.type).Word+' marked '+t.dataset.s);route();break;
      case 'email':emailDoc(docById(id));break;
      case 'print':var pd=docById(id);doPrint(docTitle(pd));break;
      case 'add-line':draft.lines.push(blankLine());$('#lines').insertAdjacentHTML('beforeend',lineRow(draft.lines[draft.lines.length-1],draft.lines.length-1));var last=$$('#lines [data-lf=desc]').pop();if(last)last.focus();break;
      case 'rm-line':var i=+t.closest('tr').dataset.i;if(draft.lines.length===1)draft.lines[0]=blankLine();else draft.lines.splice(i,1);renderLines();recalcUI();break;
      case 'save-doc':var d1=commitDraft();if(d1)location.hash='#'+T(d1.type).plural;break;
      case 'save-preview':var d2=commitDraft();if(d2)location.hash='#view/'+d2.id;break;
      case 'cancel-ed':draft=null;break;
      case 'backup':backup();break;
      case 'restore':$('#fileRestore').click();break;
      case 'import':$('#fileImport').click();break;
      case 'sample':if(S.docs.length||S.customers.length){ask('Load sample data','This adds some example customers, items and invoices alongside your own. You can erase them in Settings.','Add samples').then(function(ok){if(ok)sampleData()})}else sampleData();break;
      case 'erase':eraseAll();break;
      case 'logo':$('#fileLogo').click();break;
      case 'logo-clear':S.settings.logo='';save();vSettings();break;
    }
    return;
  }
  var tr=e.target.closest('tr[data-href]');
  if(tr&&!e.target.closest('a,button,input,select'))location.hash='#'+tr.dataset.href;
});
$('#fileRestore').addEventListener('change',function(e){restoreFile(e.target.files[0]);e.target.value=''});
$('#fileLogo').addEventListener('change',function(e){pickLogo(e.target.files[0]);e.target.value=''});
$('#fileImport').addEventListener('change',function(e){importFiles(e.target.files);e.target.value=''});

/* ---------- online sync ---------- */
var SYNC_KEY='invoiceflow.sync';
var SY=(function(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||null}catch(e){return null}})();
var syBusy=false,syTimer=null,syVer=0,syAsking=false,syMsg='';
function syStore(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}
function syLabel(){
  if(!SY)return{t:'',c:''};
  if(syMsg)return{t:syMsg,c:'bad'};
  if(syBusy||SY.dirty)return{t:'Saving online…',c:'saving'};
  return{t:'Saved online',c:'ok'};
}
function syChip(){
  var c=$('#syncChip');if(!c)return;
  if(!SY){c.hidden=true;return}
  var l=syLabel();c.hidden=false;c.className='syncchip '+l.c;c.innerHTML='<i></i>'+esc(l.t);
  var st=$('#sy-status');if(st)st.textContent=l.t;
}
function syCall(cfg,body){
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({pass:cfg.pass},body))}).then(function(r){
    return r.json().catch(function(){return{error:'badserver'}}).then(function(j){j.status=r.status;return j});
  });
}
function syErr(j){
  if(j.error==='password')return 'Wrong sync password';
  if(j.error==='short')return 'Sync password is too short';
  if(j.error==='badserver')return 'Sync address is not right';
  return 'Online sync problem';
}
function syncDirty(){
  if(!SY)return;
  SY.dirty=true;syVer++;syStore();syMsg='';syChip();
  clearTimeout(syTimer);syTimer=setTimeout(syPush,1200);
}
function syPush(){
  if(!SY)return;
  if(syBusy){clearTimeout(syTimer);syTimer=setTimeout(syPush,800);return}
  if(syAsking)return;
  syBusy=true;syChip();var ver=syVer;
  syCall(SY,{action:'put',rev:SY.rev,state:JSON.stringify(S)}).then(function(j){
    syBusy=false;
    if(j.status===200&&j.rev!=null){SY.rev=j.rev;if(ver===syVer)SY.dirty=false;syStore();syMsg='';syChip();if(SY.dirty)syPush();return}
    if(j.status===409){syChip();syConflict();return}
    syMsg=syErr(j);syChip();
  }).catch(function(){syBusy=false;syMsg='Offline - will save online when connected';syChip();clearTimeout(syTimer);syTimer=setTimeout(syPush,20000)});
}
function syApply(j){
  var o=JSON.parse(j.state),d=defaults();
  S=Object.assign({},d,o);S.settings=Object.assign({},d.settings,o.settings||{});
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  SY.rev=j.rev;SY.dirty=false;syStore();syMsg='';syChip();
}
function syRefresh(){
  var h=location.hash;
  if(draft||document.querySelector('dialog[open]')||h.indexOf('#new')===0||h.indexOf('#edit')===0){toast('Updated from another computer. Finish what you are doing, then reopen the page to see it.');return}
  route();
}
function syPull(){
  if(!SY||syBusy||syAsking)return Promise.resolve();
  return syCall(SY,{action:'get',since:SY.rev}).then(function(j){
    if(j.status!==200){syMsg=syErr(j);syChip();return}
    syMsg='';
    if(j.same){syChip();return}
    if(SY.dirty){syConflict(j);return}
    if(j.state){syApply(j);syRefresh()}
  }).catch(function(){syMsg='Offline - will save online when connected';syChip()});
}
function syConflict(j){
  if(syAsking)return;syAsking=true;
  var fetchLatest=j?Promise.resolve(j):syCall(SY,{action:'get'});
  fetchLatest.then(function(latest){
    var pick='';
    var dlg=modal('Two copies have changed','<p>This computer and the online copy have both changed since they last matched. Which one do you want to keep? The other one is replaced.</p><p class="note">Tip: keep the one you worked on most recently. You can download a backup of this computer first in Settings.</p><div class="row"><button type="button" class="btn" id="c-online">Use the online copy</button></div>',{ok:'Keep this computer’s copy',cancel:'Decide later',onOk:function(){pick='local'}});
    dlg.querySelector('#c-online').addEventListener('click',function(){pick='online';dlg.close()});
    dlg.addEventListener('close',function(){
      syAsking=false;
      if(pick==='local'){SY.rev=latest.rev;SY.dirty=true;syStore();syPush()}
      else if(pick==='online'&&latest.state){syApply(latest);syRefresh()}
    });
  }).catch(function(){syAsking=false});
}
function syConnect(url,pass){
  url=String(url||'').trim();pass=String(pass||'');
  if(!url){toast('Type the sync address first.','bad');return}
  if(pass.length<6){toast('The sync password must be at least 6 characters.','bad');return}
  var cfg={url:url,pass:pass};
  syCall(cfg,{action:'get'}).then(function(j){
    if(j.status!==200){toast(syErr(j),'bad');return}
    var localHas=S.docs.length||S.customers.length||S.items.length;
    var finish=function(useOnline){
      SY={url:url,pass:pass,rev:j.rev,dirty:false};
      if(useOnline){syApply(j);toast('Connected. Showing the online copy.');route()}
      else{SY.dirty=true;syStore();syPush();toast('Connected. This computer’s copy is now online.');route()}
      syStore();syChip();
    };
    if(!j.state){finish(false);return}
    if(!localHas){finish(true);return}
    var pick='';
    var dlg=modal('Connect to online copy','<p>There is already data online, and this computer has data too. Which one should be used from now on?</p><p class="note">The other one is replaced. Daily safety copies are kept on the server.</p><div class="row"><button type="button" class="btn" id="c-local">Use this computer’s copy</button></div>',{ok:'Use the online copy',cancel:'Cancel',onOk:function(){pick='online'}});
    dlg.querySelector('#c-local').addEventListener('click',function(){pick='local';dlg.close()});
    dlg.addEventListener('close',function(){if(pick)finish(pick==='online')});
  }).catch(function(){toast('Could not reach that address. Check the spelling and that you are online.','bad')});
}
function syncCardHTML(){
  var defUrl=/^https?:/.test(location.protocol)?new URL('sync.php',location.href).href:'';
  if(SY)return '<div class="card pad" style="margin-top:16px"><h2 style="margin-bottom:6px">Online sync</h2><p class="note" style="margin:0 0 10px">This computer is connected to your online copy at <b>'+esc(SY.url)+'</b>. Every change is saved there within a couple of seconds, and other computers pick it up automatically. Status: <b id="sy-status">'+esc(syLabel().t)+'</b></p><div class="btns"><button class="btn" data-act="sync-now">Sync now</button><button class="btn danger" data-act="sync-off">Disconnect this computer</button></div></div>';
  return '<div class="card pad" style="margin-top:16px"><h2 style="margin-bottom:6px">Online sync</h2><p class="note" style="margin:0 0 12px">Use the same invoices on every computer. You put one small file (<b>sync.php</b>) on your web hosting, then connect each computer here. Type a password of your own choosing the first time. The first computer to connect sets it, and every other computer uses the same one.</p><div class="grid2"><div class="field"><label for="sy-url">Sync address</label><input id="sy-url" placeholder="https://yourwebsite.co.za/invoices/sync.php" value="'+esc(defUrl)+'"></div><div class="field"><label for="sy-pass">Sync password</label><input id="sy-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div></div><div class="btns" style="margin-top:12px"><button class="btn primary" data-act="sync-connect">Connect this computer</button></div></div>';
}
setInterval(function(){if(SY&&!document.hidden)syPull()},30000);
document.addEventListener('visibilitychange',function(){if(SY&&!document.hidden)syPull()});
if(SY){syChip();if(SY.dirty)syPush();else syPull()}

/* ---------- theme ---------- */
function getTheme(){try{return localStorage.getItem(THEME_KEY)||'auto'}catch(e){return 'auto'}}
function applyTheme(){
  var t=getTheme(),r=document.documentElement;
  if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  $('#themeBtn').textContent='Theme: '+(t==='auto'?'Auto':t==='dark'?'Dark':'Light');
}
function cycleTheme(){
  var n={auto:'light',light:'dark',dark:'auto'}[getTheme()];
  try{localStorage.setItem(THEME_KEY,n)}catch(e){}
  applyTheme();
}
applyTheme();
route();
})();
</script>
