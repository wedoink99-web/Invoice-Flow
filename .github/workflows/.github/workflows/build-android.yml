name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the Android project
        working-directory: mobile
        run: |
          rm -rf www && cp -r ../www www
          npm install
          npx cap add android
          npx cap sync android
          PKG=android/app/src/main/java/za/co/signgirls/invoiceflow
          mkdir -p $PKG
          cp native/MainActivity.java native/NativePrintPlugin.java $PKG/
          cp -r android-res/* android/app/src/main/res/
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk InvoiceFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceFlow-Android
          path: InvoiceFlow.apk
